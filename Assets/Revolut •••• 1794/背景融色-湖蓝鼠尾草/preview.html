<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo 背景融合对比</title><style>
body{margin:0;padding:24px;background:#11141d;color:#f4f4f8;font:16px/1.5 system-ui,-apple-system,sans-serif}
h1{margin:0 0 8px;font-size:24px}p{color:#c7c8d2;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(92vw,620px),1fr));gap:24px}
h2{font-size:17px;font-weight:600}.card{position:relative;width:100%;aspect-ratio:1536/969;overflow:hidden;border-radius:3.7%;background:#151923}
.card img{position:absolute;display:block}.background{width:100.000000%;height:100.000000%;left:0.000000%;top:0.000000%}
.overlay{inset:0;width:100%;height:100%}
</style></head><body><h1>Logo 背景融合对比</h1><p>原背景只作预览；下面叠加的是可直接上传的 SVG。</p>
<div class="grid"><section><h2>upload-fusion</h2><div class="card">
<img class="background" src="background-reference.png" alt="">
<img class="overlay" src="upload-fusion.svg" alt="upload-fusion logo overlay"></div></section><section><h2>upload-fusion-bright</h2><div class="card">
<img class="background" src="background-reference.png" alt="">
<img class="overlay" src="upload-fusion-bright.svg" alt="upload-fusion-bright logo overlay"></div></section></div></body></html>
